<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Cyber Sys</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }

    .navbar {
      background: rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(10px);
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .navbar h1 {
      font-size: 24px;
      font-weight: 600;
    }

    .navbar button {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 2px solid white;
      padding: 8px 16px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s;
    }

    .navbar button:hover {
      background: white;
      color: #667eea;
    }

    .container {
      max-width: 800px;
      margin: 60px auto;
      padding: 40px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    .container h2 {
      color: #333;
      font-size: 32px;
      margin-bottom: 20px;
    }

    .user-info {
      background: #f5f5f5;
      padding: 20px;
      border-radius: 5px;
      margin-bottom: 30px;
      color: #555;
    }

    .user-info p {
      margin: 8px 0;
      font-size: 16px;
    }

    .user-info strong {
      color: #667eea;
    }

    .welcome-message {
      font-size: 18px;
      color: #555;
      line-height: 1.6;
    }

    .customize-note {
      background: #e8f4f8;
      border-left: 4px solid #667eea;
      padding: 15px;
      margin-top: 20px;
      border-radius: 5px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <h1>Cyber Sys</h1>
    <button onclick="logout()">Sair</button>
  </div>

  <div class="container">
    <h2>Seja bem-vindo!</h2>

    <div class="user-info">
      <p>Bem-vindo, <strong id="username"></strong>!</p>
      <p>Email: <strong id="email"></strong></p>
    </div>

    <div class="welcome-message">
      <p>Você está conectado ao dashboard!</p>
      <p>Personalize este espaço do seu jeito. 🎨</p>
    </div>

    <div class="customize-note">
      ✏️ Dica: Você pode editar o arquivo <strong>dashboard.html</strong> para customizar este
      espaço conforme sua necessidade.
    </div>
  </div>

  <script>
    // Verificar se o usuário está autenticado
    const token = localStorage.getItem('token');
    const user = localStorage.getItem('user');

    if (!token || !user) {
      window.location.href = '/';
    } else {
      // Exibir informações do usuário
      const userData = JSON.parse(user);
      document.getElementById('username').textContent = userData.username;
      document.getElementById('email').textContent = userData.email;
    }

    // Função de logout
    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = '/';
    }
  </script>
</body>
</html>
